name: Собрать и выпустить установщик

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis

      - name: Скачать FFmpeg для Windows
        run: |
          mkdir -p bin ffmpeg-dl
          curl -sSL -o ffmpeg-dl/ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg-dl/ff.zip -d ffmpeg-dl
          cp ffmpeg-dl/*/bin/ffmpeg.exe bin/ffmpeg.exe

      - name: Установить зависимости
        run: npm ci

      - name: Собрать установщик
        run: npm run dist

      - name: Узнать версию
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ClipCut ${{ steps.ver.outputs.version }}
          files: dist/ClipCut-Setup-*.exe
          body: |
            Видеоредактор ClipCut для Windows 10/11 (64-бит).

            **Скачайте `ClipCut-Setup-${{ steps.ver.outputs.version }}.exe` ниже и запустите.** Если Windows покажет «Windows защитил ваш компьютер», нажмите «Подробнее» → «Выполнить в любом случае»: у установщика нет цифровой подписи.

            Возможности: обрезка и нарезка, кадрирование, поворот, скорость, звук, цвет, плавные переходы. Экспорт в MP4 (H.264/H.265), WebM, GIF, MP3, до 4K и 60 FPS, с ускорением на видеокартах NVIDIA, AMD и Intel.
